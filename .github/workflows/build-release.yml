name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node scripts/fetch-icons.mjs
      - run: npm.cmd ci --prefix desktop
      - name: Build clean desktop folder
        shell: pwsh
        run: |
          $env:RUSTJAN_BUILD_WORK = Join-Path $env:RUNNER_TEMP 'rustjan-build'
          node desktop/build.mjs out/RustJan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-bundle.mjs out/RustJan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path out/RustJan -DestinationPath "out/RustJan-v$version-win-x64.zip"
          $asset = Get-Item "out/RustJan-v$version-win-x64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLower()
          "$hash  $($asset.Name)" | Set-Content -Encoding ascii "out/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustJan-Windows-ZIP
          path: |
            out/*.zip
            out/SHA256SUMS.txt
      - name: Publish tag release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Release already exists; existing download assets and counts are preserved.'
          } else {
            $assets = @(Get-ChildItem out/*.zip | ForEach-Object FullName) + @((Resolve-Path out/SHA256SUMS.txt).Path)
            gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --title "RustJan $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0
